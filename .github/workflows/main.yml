name: Build TaungThuEain POS APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Create Android wrapper
        run: |
          mkdir -p android-wrapper/www
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taungthueain.pos",
            "appName": "TaungThuEain POS",
            "webDir": "www",
            "server": {
              "url": "https://downloadertilk-sys.github.io/Farmer-s-House/",
              "cleartext": false,
              "allowNavigation": [
                "downloadertilk-sys.github.io",
                "*.firebaseapp.com",
                "*.googleapis.com",
                "*.gstatic.com"
              ]
            }
          }
          EOF
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body></body></html>' > www/index.html
          npx cap add android
          npx cap sync android

      - name: Install legacy PNG launcher icons
        run: |
          set -eux
          test -f TaungThuEain-Android-Logo-Assets-v4.zip
          mkdir -p logo-assets
          unzip -o TaungThuEain-Android-Logo-Assets-v4.zip -d logo-assets

          APP_RES="android-wrapper/android/app/src/main/res"
          rm -f logo-assets/res/values/colors.xml
          cp -R logo-assets/res/. "$APP_RES/"

          # Remove adaptive icon resources generated by Capacitor.
          # This forces Android to use the supplied density-specific PNG icons.
          rm -rf "$APP_RES/mipmap-anydpi-v26"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android-wrapper/android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.attrib.pop(ns + "roundIcon", None)
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$APP_RES/mipmap-$density/ic_launcher.png"
          done
          test ! -d "$APP_RES/mipmap-anydpi-v26"
          grep -q '@mipmap/ic_launcher' android-wrapper/android/app/src/main/AndroidManifest.xml
          ! grep -q 'roundIcon' android-wrapper/android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaungThuEain-POS-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
