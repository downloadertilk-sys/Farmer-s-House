
name: Build TaungThuEain POS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android wrapper
        run: |
          mkdir -p android-wrapper/www
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.taungthueain.pos",
            "appName": "TaungThuEain POS",
            "webDir": "www",
            "server": {
              "url": "https://downloadertilk-sys.github.io/Farmer-s-House/",
              "cleartext": false,
              "allowNavigation": [
                "downloadertilk-sys.github.io",
                "*.firebaseapp.com",
                "*.googleapis.com",
                "*.gstatic.com"
              ]
            }
          }
          EOF

          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body></body></html>' > www/index.html

          npx cap add android
          npx cap sync android

      - name: Add TaungThuEain App Logo
        run: |
          test -f TaungThuEain-Android-Logo-Assets.zip
          mkdir -p logo-assets
          unzip -o TaungThuEain-Android-Logo-Assets.zip -d logo-assets

          cp -R logo-assets/res/. android-wrapper/android/app/src/main/res/

          echo "Checking app icon files..."
          test -f android-wrapper/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android-wrapper/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android-wrapper/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaungThuEain-POS-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
